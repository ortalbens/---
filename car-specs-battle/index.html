<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דו־קרב מפרטים — השוואת רכבים</title>
<meta name="description" content="הקלידו שני דגמי רכב וקבלו השוואת מפרטים אינטראקטיבית: ביצועים, מנוע, יעילות, מידות — ומי מנצח.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0b0c0f;
  --surface:#14161b;
  --surface-2:#1b1e25;
  --surface-3:#232731;
  --line:#2b303b;
  --text:#f5f6f8;
  --muted:#a6adbb;
  --a:#c8ff3d;
  --b:#ff6a2b;
  --gold:#ffd447;
  --ink:#0b0c0f;
  --r:22px;
  --num:'Space Grotesk', 'Heebo', sans-serif;
  --slab:0 1px 0 rgba(255,255,255,.07) inset, 0 7px 0 -1px #08090b, 0 26px 44px -22px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; overflow-x:hidden;
  font-family:'Heebo', system-ui, sans-serif; font-size:16px; line-height:1.5;
  color:var(--text);
  background:
    radial-gradient(700px 420px at 100% 0%, rgba(200,255,61,.10), transparent 65%),
    radial-gradient(700px 420px at 0% 0%, rgba(255,106,43,.11), transparent 65%),
    var(--bg);
}
body::before{ /* subtle dot texture */
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:linear-gradient(to bottom, #000, transparent 70%);
  -webkit-mask-image:linear-gradient(to bottom, #000, transparent 70%);
}
.wrap{max-width:1160px; margin:0 auto; padding:32px 16px 64px}
.side-a{--c:var(--a)}
.side-b{--c:var(--b)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid #fff; outline-offset:3px}

/* ---------- Header ---------- */
.top{text-align:center; margin-bottom:30px}
.brand{display:inline-flex; align-items:center; gap:10px; font-family:var(--num); font-weight:700; letter-spacing:.18em; font-size:.8rem; color:var(--muted); direction:ltr}
.brand i{width:26px; height:10px; border-radius:3px; background:linear-gradient(90deg, var(--b) 50%, var(--a) 50%)}
h1{
  margin:10px 0 8px; font-weight:900; line-height:1.02; letter-spacing:-.02em;
  font-size:clamp(2.3rem, 8vw, 4.6rem);
}
h1 .x{display:inline-block; color:var(--a)}
h1 .y{display:inline-block; color:var(--b)}
.tagline{margin:0 auto; max-width:560px; color:var(--muted); font-size:clamp(1rem, 2.6vw, 1.15rem)}

/* ---------- Picker ---------- */
.picker{
  display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:start;
  padding:22px; border-radius:28px; background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--slab);
}
.slot{position:relative}
.slot-label{display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:8px}
.slot-label::before{content:""; width:12px; height:12px; border-radius:4px; background:var(--c); box-shadow:0 0 14px var(--c)}
.search{position:relative}
.search input{
  width:100%; min-height:56px; padding:0 48px 0 16px;
  font:inherit; font-size:1.08rem; font-weight:500; color:var(--text);
  background:var(--surface-2); border:2px solid var(--line); border-radius:16px;
  transition:border-color .2s, box-shadow .2s;
}
.search input::placeholder{color:#7d8494}
.search input:focus{outline:none; border-color:var(--c); box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent)}
.search svg{position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; color:var(--muted); pointer-events:none}
.search .clear{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  width:38px; height:38px; border-radius:10px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:1.3rem;
}
.search .clear:hover{background:var(--surface-3); color:var(--text)}
.search .clear[hidden]{display:none}
.suggest{
  position:absolute; inset-inline:0; top:calc(100% + 8px); z-index:20;
  margin:0; padding:6px; list-style:none; max-height:340px; overflow:auto;
  background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 24px 50px -12px rgba(0,0,0,.85);
}
.suggest[hidden]{display:none}
.suggest li{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:11px; cursor:pointer}
.suggest li[aria-selected="true"], .suggest li:hover{background:var(--surface-3)}
.suggest li[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--c)}
.suggest .s-name{font-weight:700}
.suggest .s-name small{font-weight:400; color:var(--muted)}
.suggest .s-meta{color:var(--muted); font-size:.85rem; white-space:nowrap; font-family:var(--num)}
.suggest .s-empty{cursor:default; color:var(--muted); display:block}
.suggest .s-head{cursor:default; font-size:.78rem; color:var(--muted); padding:6px 12px 4px}
.suggest .s-head:hover{background:none}
mark{background:none; color:var(--c); font-weight:800}

.preview{
  margin-top:12px; min-height:64px; padding:12px 14px; border-radius:14px;
  border:1px dashed var(--line); color:var(--muted); font-size:.92rem;
  display:flex; align-items:center; gap:12px;
}
.preview.filled{border-style:solid; border-color:color-mix(in srgb, var(--c) 45%, var(--line)); background:color-mix(in srgb, var(--c) 6%, transparent); color:var(--text)}
.preview .pv-hp{font-family:var(--num); font-weight:700; font-size:1.5rem; color:var(--c); line-height:1}
.preview .pv-hp small{display:block; font-family:'Heebo'; font-size:.72rem; color:var(--muted); font-weight:500; margin-top:3px}
.preview .pv-txt b{display:block}
.preview .pv-txt span{color:var(--muted); font-size:.85rem}
.slot-err{color:#ff8f8f; font-size:.88rem; margin:8px 0 0; min-height:0}

.mid{display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:34px}
.vs-chip{
  width:58px; height:58px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--num); font-weight:700; font-size:1.1rem; direction:ltr;
  background:var(--ink); border:2px solid var(--line);
  box-shadow:-4px 0 18px -6px var(--a), 4px 0 18px -6px var(--b);
}
.icon-btn{
  width:42px; height:42px; border-radius:12px; display:grid; place-items:center; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
}
.icon-btn:hover{color:var(--text); border-color:#4a5262}
.icon-btn svg{width:20px; height:20px}

.actions{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; margin-top:22px}
.go{
  position:relative; cursor:pointer; border:0; border-radius:16px;
  padding:18px 40px; min-width:260px;
  font-weight:900; font-size:1.25rem; color:var(--ink);
  background:linear-gradient(100deg, var(--b), #ffb02b 48%, var(--a));
  box-shadow:0 6px 0 #6d3a12, 0 18px 40px -10px rgba(255,140,40,.6);
  transition:transform .12s, box-shadow .12s, filter .2s;
}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:active:not(:disabled){transform:translateY(5px); box-shadow:0 1px 0 #6d3a12, 0 8px 20px -10px rgba(255,140,40,.6)}
.go:disabled{cursor:not-allowed; filter:grayscale(1) brightness(.5); box-shadow:0 6px 0 #222}
.ghost{
  cursor:pointer; padding:12px 18px; border-radius:14px; font-weight:700;
  background:transparent; border:1px solid var(--line); color:var(--text);
  display:inline-flex; align-items:center; gap:8px;
}
.ghost:hover{background:var(--surface-2)}
.presets{margin-top:22px; text-align:center}
.presets p{margin:0 0 10px; color:var(--muted); font-size:.9rem}
.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.chip{
  cursor:pointer; padding:8px 14px; border-radius:999px; font-size:.9rem; font-weight:500;
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  transition:transform .15s, border-color .15s;
}
.chip:hover{transform:translateY(-2px); border-color:#565e70}

/* ---------- Results ---------- */
#results{margin-top:44px; scroll-margin-top:12px}
#results[hidden]{display:none}
.res-bar{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px}
.res-bar h2{margin:0; font-size:1.05rem; color:var(--muted); font-weight:500}
.toast{position:fixed; bottom:20px; left:50%; transform:translate(-50%, 20px); opacity:0; z-index:60;
  background:var(--text); color:var(--ink); font-weight:700; padding:10px 18px; border-radius:12px; transition:.25s; pointer-events:none}
.toast.show{opacity:1; transform:translate(-50%, 0)}

/* Hero duel cards */
.duel{display:grid; grid-template-columns:1fr auto 1fr; gap:20px; align-items:center; perspective:1400px}
.duel .vs-chip{width:70px; height:70px; font-size:1.3rem}
.hero{
  position:relative; overflow:hidden; border-radius:26px; padding:22px 22px 18px;
  background:
    radial-gradient(500px 220px at 100% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  border:1px solid color-mix(in srgb, var(--c) 40%, var(--line));
  box-shadow:var(--slab), 0 0 0 0 transparent;
  transform-style:preserve-3d; transition:transform .2s ease-out, box-shadow .4s;
  animation:dealIn .9s cubic-bezier(.2,.9,.25,1) backwards;
}
.hero.side-b{animation-delay:.15s}
.hero.champ{border-color:var(--gold); box-shadow:var(--slab), 0 0 46px -10px rgba(255,212,71,.55)}
.hero .glare{position:absolute; inset:0; pointer-events:none; background:radial-gradient(400px circle at var(--gx,50%) var(--gy,0%), rgba(255,255,255,.10), transparent 45%); opacity:0; transition:opacity .3s}
.hero:hover .glare{opacity:1}
.hc-top{display:flex; justify-content:space-between; align-items:center}
.tag{font-size:.8rem; font-weight:800; padding:4px 10px; border-radius:8px; color:var(--ink); background:var(--c)}
.hc-year{font-family:var(--num); color:var(--muted); font-weight:700}
.hc-make{margin:14px 0 0; color:var(--muted); font-weight:500}
.hc-model{margin:0; font-size:clamp(1.7rem, 4.5vw, 2.4rem); font-weight:900; line-height:1.05; letter-spacing:-.01em}
.hc-trim{margin:4px 0 0; color:var(--muted)}
.hc-art{display:block; width:100%; height:auto; margin:10px 0 2px; transform:translateZ(30px)}
.hc-art path{fill:color-mix(in srgb, var(--c) 16%, transparent); stroke:var(--c); stroke-width:2.5; stroke-linejoin:round}
.hc-art circle{fill:var(--ink); stroke:var(--c); stroke-width:2.5}
.hc-art line{stroke:var(--line); stroke-width:2}
.hc-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; transform:translateZ(20px)}
.hc-hp b{display:block; font-family:var(--num); font-size:clamp(2.4rem, 7vw, 3.4rem); line-height:.9; color:var(--c)}
.hc-hp span{color:var(--muted); font-size:.85rem}
.hc-mini{display:flex; gap:16px; margin:0}
.hc-mini div{text-align:center}
.hc-mini dt{font-size:.75rem; color:var(--muted)}
.hc-mini dd{margin:0; font-family:var(--num); font-weight:700}
.crown{
  position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:2;
  display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
  background:var(--gold); color:var(--ink); font-weight:900; font-size:.85rem;
  box-shadow:0 0 22px rgba(255,212,71,.6);
  animation:pop .6s cubic-bezier(.2,1.5,.4,1) both;
}
.crown svg{width:16px; height:16px}

/* Verdict */
.verdict{
  display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:20px; margin-top:28px;
}
.panel{
  border-radius:var(--r); padding:22px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--slab);
}
.v-main{position:relative; overflow:hidden}
.v-main.win{border-color:color-mix(in srgb, var(--gold) 55%, var(--line))}
.v-main.win::before{ /* checkered strip */
  content:""; position:absolute; inset:0 0 auto 0; height:10px;
  background:conic-gradient(#fff 25%, #0b0c0f 0 50%, #fff 0 75%, #0b0c0f 0) 0 0 / 20px 20px;
  opacity:.85;
}
.kicker{display:flex; align-items:center; gap:8px; margin:6px 0 4px; font-weight:800; color:var(--gold); letter-spacing:.02em}
.kicker svg{width:20px; height:20px}
.v-main h2{margin:0; font-size:clamp(1.7rem, 4.6vw, 2.5rem); font-weight:900; line-height:1.1}
.v-main h2 .who{display:block; font-size:.95rem; font-weight:700; color:var(--muted); margin-bottom:2px}
.v-lead{font-size:1.1rem; margin:10px 0 18px}
.v-lead strong{color:var(--gold)}
.scores{display:flex; flex-direction:column; gap:12px}
.score-row{display:grid; grid-template-columns:72px 1fr 64px; align-items:center; gap:12px}
.score-row .nm{font-weight:800; color:var(--c)}
.score-row .tr{height:16px; border-radius:6px; background:var(--surface-3); overflow:hidden}
.score-row .tr i{display:block; height:100%; width:0; border-radius:6px; background:var(--c); transition:width 1.3s cubic-bezier(.2,.9,.2,1) .2s}
.score-row .pt{font-family:var(--num); font-weight:700; font-size:1.35rem; text-align:left}
.titles{list-style:none; padding:0; margin:18px 0 0; display:flex; flex-wrap:wrap; gap:8px}
.titles li{padding:6px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); font-size:.88rem}
.titles li b{color:var(--c)}
.method{margin-top:16px; color:var(--muted); font-size:.85rem}
.method summary{cursor:pointer; font-weight:700; color:var(--text)}
.method p{margin:8px 0 0}
.v-radar{display:flex; flex-direction:column; align-items:center}
.v-radar h3{margin:0 0 6px; align-self:flex-start; font-size:1.05rem}
.radar{width:100%; max-width:360px; height:auto; overflow:visible}
.radar .ring{fill:none; stroke:var(--line)}
.radar .axis{stroke:var(--line)}
.radar .lbl{fill:var(--muted); font-size:12.5px; font-family:'Heebo'; font-weight:500}
.radar .poly{stroke-width:2.5; stroke-linejoin:round; transform-origin:180px 160px; transform:scale(0); transition:transform 1.1s cubic-bezier(.2,1.2,.3,1)}
.radar .poly.a{fill:color-mix(in srgb, var(--a) 22%, transparent); stroke:var(--a)}
.radar .poly.b{fill:color-mix(in srgb, var(--b) 22%, transparent); stroke:var(--b); transition-delay:.15s}
.in .radar .poly{transform:scale(1)}
.legend{display:flex; gap:16px; font-size:.88rem; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:3px; background:var(--c)}

/* Groups & metric cards */
.group{margin-top:40px}
.group-h{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
.group-h h3{margin:0; font-size:1.5rem; font-weight:900}
.group-h span{color:var(--muted); font-size:.92rem}
.mgrid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; perspective:1200px}
.mcard{
  position:relative; display:block; width:100%; min-height:200px; padding:0; margin:0;
  border:0; background:none; text-align:start; cursor:pointer;
  perspective:1000px;
  opacity:0; transform:translateY(34px) rotateX(-28deg);
  transition:opacity .6s, transform .8s cubic-bezier(.2,.9,.25,1);
  transition-delay:calc(var(--i, 0) * 70ms);
}
.in .mcard{opacity:1; transform:none}
.mc-inner{position:relative; height:100%; min-height:inherit; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.3,1.25,.5,1)}
.mcard:not(.flipped):hover .mc-inner{transform:translateY(-4px) rotateX(5deg)}
.mcard.flipped .mc-inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; padding:18px; border-radius:20px;
  background:linear-gradient(180deg, var(--surface-2), var(--surface));
  border:1px solid var(--line); box-shadow:var(--slab);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column;
}
.face.front{position:relative; min-height:inherit}
.face.back{transform:rotateY(180deg); background:linear-gradient(180deg, #20242d, #181b21); justify-content:center}
.mc-h{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:14px}
.mc-h h4{margin:0; font-size:1.05rem; font-weight:800}
.badge{flex:none; font-size:.78rem; font-weight:800; padding:4px 9px; border-radius:8px; background:var(--surface-3); color:var(--muted); white-space:nowrap}
.badge.side-a, .badge.side-b{background:color-mix(in srgb, var(--c) 16%, transparent); color:var(--c)}
.rows{display:flex; flex-direction:column; gap:12px}
.row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px}
.row-top .who{font-size:.82rem; font-weight:700; color:var(--c)}
.row-top .val{font-weight:700; white-space:nowrap}
.row-top .val b{font-family:var(--num); font-size:1.3rem}
.row-top .val small{color:var(--muted); font-weight:500; margin-inline-start:2px}
.row.na .val{color:var(--muted); font-weight:500; font-size:.92rem}
.row.lead .val b{color:var(--c)}
.track{height:10px; border-radius:5px; background:var(--surface-3); overflow:hidden}
.track i{display:block; height:100%; width:0; border-radius:5px; background:var(--c); opacity:.55; transition:width 1.1s cubic-bezier(.2,.9,.2,1); transition-delay:calc(.25s + var(--i, 0) * 70ms)}
.row.lead .track i{opacity:1; box-shadow:0 0 14px -2px var(--c)}
.in .track i{width:var(--w)}
.row.na .track{background:repeating-linear-gradient(-45deg, var(--surface-3) 0 5px, transparent 5px 10px)}
.flip-hint{margin-top:auto; padding-top:12px; font-size:.78rem; color:#7d8494; display:flex; align-items:center; gap:5px}
.back h4{margin:0 0 8px; font-size:1.05rem}
.back p{margin:0; color:#d5d9e1; font-size:.95rem}
.back .diff{margin-top:12px; font-weight:700; color:var(--text)}

.tcard{grid-column:span 2}
.ttable{width:100%; border-collapse:collapse}
.ttable th, .ttable td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:start; vertical-align:top}
.ttable tr:last-child th, .ttable tr:last-child td{border-bottom:0}
.ttable th{color:var(--muted); font-weight:500; font-size:.9rem; width:26%}
.ttable td{font-weight:700}
.ttable thead th{font-size:.82rem; font-weight:800}
.ttable thead th.side-a, .ttable thead th.side-b{color:var(--c)}

/* Dimensions blueprint */
.blueprint{grid-column:1 / -1; opacity:0; transform:translateY(24px); transition:opacity .6s, transform .8s}
.in .blueprint{opacity:1; transform:none}
.bp-grid{display:grid; grid-template-columns:3fr 1.3fr; gap:18px; align-items:end}
.bp-grid figure{margin:0}
.bp-grid figcaption{color:var(--muted); font-size:.85rem; margin-top:6px; text-align:center}
.bp-svg{width:100%; height:auto; display:block;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 20px 20px;
  border-radius:14px; border:1px solid var(--line);
}
.bp-svg .shape{stroke-width:2.2; stroke-linejoin:round}
.bp-svg .shape.a{fill:color-mix(in srgb, var(--a) 13%, transparent); stroke:var(--a)}
.bp-svg .shape.b{fill:color-mix(in srgb, var(--b) 13%, transparent); stroke:var(--b); stroke-dasharray:7 5}
.bp-svg .wheel.a{fill:none; stroke:var(--a); stroke-width:2}
.bp-svg .wheel.b{fill:none; stroke:var(--b); stroke-width:2; stroke-dasharray:5 4}
.bp-svg .ground{stroke:#4a5262; stroke-width:2}
.bp-svg .draw{stroke-dasharray:2400; stroke-dashoffset:2400; transition:stroke-dashoffset 1.8s ease-out}
.in .bp-svg .draw{stroke-dashoffset:0}
.bp-legend{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:14px; font-size:.9rem}
.bp-legend span{display:flex; align-items:center; gap:8px}
.bp-legend i{width:22px; height:0; border-top:3px solid var(--c)}
.bp-legend .side-b i{border-top-style:dashed}

.full{margin-top:40px}
.full summary{cursor:pointer; font-weight:800; font-size:1.1rem; padding:16px 20px; border-radius:16px; background:var(--surface); border:1px solid var(--line); list-style:none; display:flex; justify-content:space-between}
.full summary::-webkit-details-marker{display:none}
.full summary::after{content:"+"; font-family:var(--num); color:var(--muted)}
.full[open] summary::after{content:"−"}
.full .scroll{overflow-x:auto; margin-top:10px; border-radius:16px; border:1px solid var(--line); background:var(--surface)}
.full table{width:100%; border-collapse:collapse; min-width:480px}
.full th, .full td{padding:11px 14px; border-bottom:1px solid var(--line); text-align:start}
.full thead th{position:sticky; top:0; background:var(--surface-2)}
.full td.win{color:var(--c); font-weight:800}

footer{margin-top:56px; text-align:center; color:var(--muted); font-size:.85rem}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}

@keyframes dealIn{from{opacity:0; transform:translateY(40px) rotateY(-35deg) rotateX(14deg) scale(.92)}to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:translateX(-50%) scale(.6)}to{opacity:1; transform:translateX(-50%) scale(1)}}

@media (max-width: 960px){
  .mgrid{grid-template-columns:repeat(2, minmax(0,1fr))}
  .verdict{grid-template-columns:1fr}
}
@media (max-width: 760px){
  .picker{grid-template-columns:1fr; padding:16px}
  .mid{flex-direction:row; justify-content:center; padding-top:0}
  .duel{grid-template-columns:1fr; gap:14px}
  .duel .vs-chip{justify-self:center; width:56px; height:56px; font-size:1.05rem}
  .bp-grid{grid-template-columns:1fr}
  .tcard{grid-column:1 / -1}
}
@media (max-width: 560px){
  .mgrid{grid-template-columns:1fr}
  .go{width:100%}
  .hc-mini{gap:10px}
  .score-row{grid-template-columns:60px 1fr 56px}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; transition-delay:0s !important}
  html{scroll-behavior:auto}
}
</style>
</head>

        <p class="slot-err" role="alert"></p>

    info:'הזמן שלוקח להגיע מעמידה ל-100 קמ״ש. כאן — פחות זה יותר.' },
  { g:'perf', key:'top', label:'מהירות מרבית', unit:'קמ״ש', better:'high',
    info:'המהירות הגבוהה ביותר שהרכב מסוגל להגיע אליה (לעיתים מוגבלת אלקטרונית).' },
  { g:'engine', key:'cc', label:'נפח מנוע', unit:'סמ״ק', better:null,
    info:'הנפח הכולל של הצילינדרים. נפח גדול לא מבטיח ביצועים — מנועי טורבו קטנים מפיקים הרבה מכל ליטר.' },
  { g:'eff', key:'cons', label:'צריכה משולבת', better:'low', dec:1, bar:'good',
    info:'צריכה ממוצעת בנסיעה משולבת (עיר + בין־עירוני). פחות = חסכוני יותר.' },
  { g:'eff', key:'range', label:'טווח חשמלי', unit:'ק״מ', better:'high',
    info:'כמה קילומטרים אפשר לנסוע בטעינה מלאה לפי תקן WLTP.' },
  { g:'dims', key:'kg', label:'משקל עצמי', unit:'ק״ג', better:'low',
    info:'רכב קל מאיץ, בולם ומתפתל טוב יותר — ובדרך כלל גם צורך פחות.' },
  { g:'dims', key:'trunk', label:'תא מטען', unit:'ליטר', better:'high',
    info:'נפח תא המטען (כולל תא קדמי ברכבים חשמליים, כשקיים).' },
  { g:'dims', key:'wb', label:'בסיס גלגלים', unit:'מ״מ', better:null,
    info:'המרחק בין הסרן הקדמי לאחורי. בסיס ארוך = יותר מרחב לנוסעים ויציבות בכביש מהיר.' },
  { g:'dims', key:'len', label:'אורך', unit:'מ״מ', better:null, info:'אורך כולל של הרכב — משפיע על חניה ועל המרחב בפנים.' },
  { g:'dims', key:'wid', label:'רוחב', unit:'מ״מ', better:null, info:'רוחב הרכב ללא מראות.' },
  { g:'dims', key:'hgt', label:'גובה', unit:'מ״מ', better:null, info:'גובה נמוך = מרכז כובד נמוך ואווירודינמיקה; גבוה = תנוחת ישיבה ונוחות כניסה.' },
  { g:'dims', key:'seats', label:'מושבים', unit:'', better:'high', info:'מספר המושבים ברכב.' },
];

/* Performance score — absolute scales, so a car's score doesn't depend on its rival */
const AXES = [
  { key:'acc', label:'תאוצה',          w:30, norm:v => (14 - v) / 12,        reason:'תאוצה מהירה יותר' },
  { key:'pwr', label:'כוח־משקל',       w:25, norm:v => v / 500,              reason:'יחס כוח־משקל עדיף' },
  { key:'hp',  label:'כוח סוס',        w:20, norm:v => v / 1000,             reason:'יותר כוחות סוס' },
  { key:'top', label:'מהירות מרבית',   w:15, norm:v => (v - 140) / 210,      reason:'מהירות מרבית גבוהה יותר' },
  { key:'tq',  label:'מומנט',          w:10, norm:v => v / 1100,             reason:'מומנט חזק יותר' },
];
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const axisVal = (ax, car) => clamp(ax.norm(car[ax.key]));
const perfScore = car => AXES.reduce((s, ax) => s + ax.w * axisVal(ax, car), 0) / AXES.reduce((s, ax) => s + ax.w, 0) * 100;

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (n, dec = 0) => Number(n).toLocaleString('he-IL', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SIDE = { a: 'רכב א׳', b: 'רכב ב׳' };

function comparable(m, A, B) {
  if (A[m.key] == null || B[m.key] == null) return false;
  if (m.key === 'cons' && (A.fuel === 'ev') !== (B.fuel === 'ev')) return false;
  return true;
}
function leader(m, A, B) {
  if (!m.better || !comparable(m, A, B)) return null;
  const a = A[m.key], b = B[m.key];
  if (Math.abs(a - b) / Math.max(a, b) < 0.005) return 'tie';
  return (m.better === 'high' ? a > b : a < b) ? 'a' : 'b';
}

/* Simple, stylised side profile scaled to real length / height / wheelbase */
function profile(c, s, cx, ground) {
  const l = c.len * s, h = c.hgt * s, x0 = cx - l / 2, wr = Math.min(345 * s, h * 0.28);
  const low = c.hgt < 1300, tall = c.hgt > 1600;
  const belt = tall ? 0.56 : low ? 0.62 : 0.6;
  const rf = tall ? 0.30 : 0.38, rr = tall ? 0.90 : low ? 0.70 : 0.76;
  const P = (fx, fy) => `${(x0 + fx * l).toFixed(1)},${(ground - fy * h).toFixed(1)}`;
  const body = `M${P(0, .16)} L${P(0, belt - .1)} Q${P(0, belt)} ${P(.1, belt + .02)} L${P(.27, belt + .06)} L${P(rf, 1)} L${P(rr, 1)} L${P(tall ? .97 : .92, belt + .05)} Q${P(1, belt)} ${P(1, belt - .1)} L${P(1, .16)} Z`;
  const mid = cx + (low ? -l * 0.02 : 0);
  const w1 = mid - c.wb * s / 2, w2 = mid + c.wb * s / 2;
  return { body, wheels: [[w1, ground - wr, wr], [w2, ground - wr, wr]] };
}
function front(c, s, cx, ground) {
  const w = c.wid * s, h = c.hgt * s, x0 = cx - w / 2;
  const P = (fx, fy) => `${(x0 + fx * w).toFixed(1)},${(ground - fy * h).toFixed(1)}`;
  return `M${P(.04, .05)} L${P(0, .5)} Q${P(0, .6)} ${P(.08, .62)} L${P(.17, .64)} L${P(.24, .98)} Q${P(.5, 1.01)} ${P(.76, .98)} L${P(.83, .64)} L${P(.92, .62)} Q${P(1, .6)} ${P(1, .5)} L${P(.96, .05)} Z`;
}

/* =====================================================================
   SEARCH / SLOTS
   ===================================================================== */
function search(q) {
  const toks = norm(q).split(' ').filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  for (const c of CARS) {
    if (!toks.every(t => c.hay.includes(t))) continue;
    let score = 0;
    for (const t of toks) {
      if (c.hay.startsWith(t)) score += 3;
      if (c.hay.includes(' ' + t)) score += 2;
      if (norm(c.md) === t || norm(c.heMd) === t) score += 5;
    }
    out.push({ c, score });
  }
  return out.sort((x, y) => y.score - x.score || x.c.name.localeCompare(y.c.name)).slice(0, 8).map(o => o.c);
}
const POPULAR = ['Corolla', 'Model 3', 'Golf GTI', 'Mustang', '911', 'Octavia'].map(md => CARS.find(c => c.md === md));

function highlight(text, q) {
  const toks = norm(q).split(' ').filter(t => t.length > 0);
  let html = esc(text);
  for (const t of toks) {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
    html = html.replace(re, '<mark>$1</mark>');
  }
  return html;
}

const chosen = { a: null, b: null };
const slots = {};

function makeSlot(k) {
  const root = $(`.slot[data-side="${k}"]`);
  const input = $('input', root), list = $('.suggest', root), clear = $('.clear', root);
  const preview = $('.preview', root), err = $('.slot-err', root);
  let items = [], active = -1;

  function open(results, q) {
    items = results;
    active = results.length ? 0 : -1;
    if (!q) {
      list.innerHTML = `<li class="s-head" role="presentation">דגמים פופולריים</li>` + results.map(optHTML).join('');
    } else if (!results.length) {
      list.innerHTML = `<li class="s-empty" role="presentation">לא מצאנו את "${esc(q)}". נסו שם יצרן (למשל "קיה") או דגם באנגלית.</li>`;
    } else {
      list.innerHTML = results.map((c, i) => optHTML(c, i, q)).join('');
    }
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    paint();
  }
  function optHTML(c, i, q = '') {
    return `<li role="option" id="opt-${k}-${i}" data-i="${i}" aria-selected="false">
      <span class="s-name">${highlight(c.name, q)} <small>${esc(c.tr)}</small></span>
      <span class="s-meta">${c.y} · ${c.hp} כ״ס</span></li>`;
  }
  function close() {
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function paint() {
    $$('[role=option]', list).forEach((li, i) => li.setAttribute('aria-selected', i === active ? 'true' : 'false'));
    const el = $(`#opt-${k}-${active}`);
    if (el) { input.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({ block: 'nearest' }); }
  }
  function select(c) {
    chosen[k] = c;
    input.value = c ? c.full : '';
    clear.hidden = !c;
    err.textContent = '';
    preview.className = 'preview' + (c ? ' filled' : '');
    preview.innerHTML = c
      ? `<div class="pv-hp">${c.hp}<small>כ״ס</small></div>
         <div class="pv-txt"><b>${esc(c.mkHe)} ${esc(c.heMd || c.md)}</b><span>${esc(c.tr || 'גרסת בסיס')} · ${c.y} · ${esc(c.body)} · ${FUEL_HE[c.fuel]}</span></div>`
      : 'עוד לא נבחר רכב';
    close();
    updateGo();
  }
  function resolveTyped() {
    if (chosen[k]) return chosen[k];
    const q = input.value.trim();
    if (!q) { err.textContent = 'הקלידו שם של רכב'; return null; }
    const best = search(q)[0];
    if (best) { select(best); return best; }
    err.textContent = `לא מצאנו רכב שמתאים ל-"${q}". נסו לבחור מהרשימה.`;
    return null;
  }

  input.addEventListener('input', () => {
    if (chosen[k] && input.value !== chosen[k].full) { chosen[k] = null; preview.className = 'preview'; preview.textContent = 'עוד לא נבחר רכב'; }
    clear.hidden = !input.value;
    err.textContent = '';
    const q = input.value.trim();
    open(q ? search(q) : POPULAR, q);
    updateGo();
  });
  input.addEventListener('focus', () => { if (!chosen[k]) { const q = input.value.trim(); open(q ? search(q) : POPULAR, q); } });
  input.addEventListener('blur', () => setTimeout(close, 120));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (list.hidden) { const q = input.value.trim(); open(q ? search(q) : POPULAR, q); return; }
      e.preventDefault();
      if (!items.length) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      paint();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!list.hidden && items[active]) {
        select(items[active]);
        const other = k === 'a' ? 'b' : 'a';
        if (!chosen[other]) slots[other].input.focus(); else $('#go').focus();
      } else if (chosen.a && chosen.b) compare();
    } else if (e.key === 'Escape') close();
  });
  list.addEventListener('mousedown', e => {
    const li = e.target.closest('[role=option]');
    if (!li) return;
    e.preventDefault();
    select(items[+li.dataset.i]);
  });
  clear.addEventListener('click', () => { select(null); input.focus(); });

  return { input, select, resolveTyped, get: () => chosen[k] };
}
slots.a = makeSlot('a');
slots.b = makeSlot('b');

const goBtn = $('#go');
function updateGo() {
  goBtn.disabled = !(chosen.a || slots.a.input.value.trim()) || !(chosen.b || slots.b.input.value.trim());
}

$('#swap').addEventListener('click', () => {
  const a = chosen.a, b = chosen.b;
  slots.a.select(b); slots.b.select(a);
  if (!$('#results').hidden && a && b) compare();
});
$('#random').addEventListener('click', () => {
  const i = Math.floor(Math.random() * CARS.length);
  let j = Math.floor(Math.random() * (CARS.length - 1));
  if (j >= i) j++;
  slots.a.select(CARS[i]); slots.b.select(CARS[j]);
  compare();
});

const PRESETS = [
  ['חשמלי נגד V8', ['Tesla','Model 3'], ['Ford','Mustang']],
  ['האצ׳ים חמים', ['Honda','Civic'], ['Volkswagen','Golf GTI']],
  ['משפחתיות', ['Toyota','Corolla'], ['Skoda','Octavia']],
  ['דוד מול גוליית', ['Hyundai','i10'], ['Mercedes-AMG','G 63']],
  ['קרב היפר־חשמלי', ['Tesla','Model S'], ['Porsche','Taycan']],
  ['מלכי המסלול', ['Porsche','911'], ['Chevrolet','Corvette']],
];
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" type="button" data-p="${i}">${p[0]}</button>`).join('');
$('#presets').addEventListener('click', e => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  const p = PRESETS[+b.dataset.p];
  slots.a.select(find(...p[1])); slots.b.select(find(...p[2]));
  compare();
});

/* =====================================================================
   RENDER
   ===================================================================== */
const results = $('#results');

function heroHTML(c, k, score, champ) {
  const s = 300 / 5300, prof = profile(c, s, 160, 112);
  return `<article class="hero side-${k}${champ ? ' champ' : ''}">
    <div class="glare"></div>
    ${champ ? `<div class="crown"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5L3 7z"/></svg>המנצח</div>` : ''}
    <div class="hc-top"><span class="tag">${SIDE[k]}</span><span class="hc-year">${c.y}</span></div>
    <p class="hc-make">${esc(c.mkHe)}${c.mkHe !== c.mk ? ' · ' + esc(c.mk) : ''}</p>
    <h3 class="hc-model">${esc(c.md)}</h3>
    <p class="hc-trim">${esc(c.tr || 'גרסת בסיס')} · ${esc(c.body)} · ${FUEL_HE[c.fuel]}</p>
    <svg class="hc-art" viewBox="0 0 320 120" aria-hidden="true">
      <line x1="0" y1="112" x2="320" y2="112"/>
      <path d="${prof.body}"/>
      ${prof.wheels.map(([x, y, r]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"/>`).join('')}
    </svg>
    <div class="hc-row">
      <div class="hc-hp"><b data-to="${c.hp}">0</b><span>כוחות סוס</span></div>
      <dl class="hc-mini">
        <div><dt>0–100</dt><dd>${fmt(c.acc, 1)}″</dd></div>
        <div><dt>ציון</dt><dd data-to="${score.toFixed(0)}">0</dd></div>
      </dl>
    </div>
  </article>`;
}

function valueHTML(m, c) {
  const v = c[m.key];
  if (v == null) {
    if (m.key === 'cc' && c.fuel === 'ev') return { na: true, html: 'חשמלי — ללא נפח' };
    if (m.key === 'range') return { na: true, html: 'לא רלוונטי (לא חשמלי)' };
    return { na: true, html: 'לא זמין' };
  }
  const unit = m.key === 'cons' ? consUnit(c) : m.unit;
  return { na: false, html: `<b data-to="${v}" data-dec="${m.dec || 0}">0</b>${unit ? `<small>${unit}</small>` : ''}` };
}

function barWidth(m, v, A, B) {
  if (v == null) return 0;
  const a = A[m.key], b = B[m.key];
  if (m.key === 'cons' && !comparable(m, A, B)) return clamp(v / (v === a ? (A.fuel === 'ev' ? 25 : 16) : (B.fuel === 'ev' ? 25 : 16)), .05, 1) * 100;
  const others = [a, b].filter(x => x != null);
  if (m.bar === 'good') return clamp(Math.min(...others) / v, .05, 1) * 100;
  return clamp(v / Math.max(...others), .05, 1) * 100;
}

function deltaInfo(m, A, B) {
  const a = A[m.key], b = B[m.key];
  if (a == null || b == null) return { badge: '<span class="badge">—</span>', text: 'אין נתון לאחד הרכבים, ולכן אין השוואה ישירה.' };
  if (m.key === 'cons' && !comparable(m, A, B)) return { badge: '<span class="badge">דלק מול חשמל</span>', text: 'יחידות שונות (ליטרים מול קוט״ש) — אי אפשר להשוות ישירות.' };
  const diff = Math.abs(a - b), unit = m.key === 'cons' ? consUnit(A) : (m.unit || '');
  const diffTxt = `${fmt(diff, m.dec || 0)} ${unit}`.trim();
  if (diff === 0 || Math.abs(a - b) / Math.max(a, b) < 0.005) return { badge: '<span class="badge">שוויון</span>', text: 'שני הרכבים זהים במדד הזה.' };
  const L = leader(m, A, B);
  const pct = Math.round(Math.abs(a - b) / Math.min(a, b) * 100);
  if (!L) {
    const big = a > b ? 'a' : 'b';
    return { badge: `<span class="badge">הפרש ${pct}%</span>`, text: `ל${SIDE[big]} ערך גבוה יותר ב-${diffTxt}.` };
  }
  return { badge: `<span class="badge side-${L}">▲ ${SIDE[L]}</span>`, text: `יתרון ל${SIDE[L]}: הפרש של ${diffTxt} (${pct}%).` };
}

function metricCard(m, A, B, i) {
  const L = leader(m, A, B), d = deltaInfo(m, A, B);
  const row = (k, c) => {
    const v = valueHTML(m, c);
    return `<div class="row side-${k}${v.na ? ' na' : ''}${L === k ? ' lead' : ''}">
      <div class="row-top"><span class="who">${SIDE[k]}</span><span class="val">${v.html}</span></div>
      <div class="track"><i style="--w:${barWidth(m, c[m.key], A, B).toFixed(1)}%"></i></div>
    </div>`;
  };
  return `<button type="button" class="mcard" style="--i:${i}" aria-pressed="false">
    <div class="mc-inner">
      <div class="face front">
        <div class="mc-h"><h4>${m.label}</h4>${d.badge}</div>
        <div class="rows">${row('a', A)}${row('b', B)}</div>
        <span class="flip-hint">↻ לחצו להסבר</span>
      </div>
      <div class="face back" aria-hidden="true">
        <h4>${m.label}</h4>
        <p>${m.info}</p>
        <p class="diff">${d.text}</p>
      </div>
    </div>
  </button>`;
}

function engineCard(A, B, i) {
  const rows = [
    ['סוג מנוע', c => c.eng], ['סוג אנרגיה', c => FUEL_HE[c.fuel]],
    ['תיבת הילוכים', c => c.trans], ['הנעה', c => c.drive], ['מרכב', c => c.body],
  ];
  return `<div class="mcard tcard" style="--i:${i}"><div class="mc-inner"><div class="face front">
    <div class="mc-h"><h4>מפרט מכני</h4></div>
    <table class="ttable">
      <thead><tr><th></th><th class="side-a">${SIDE.a}</th><th class="side-b">${SIDE.b}</th></tr></thead>
      <tbody>${rows.map(([l, f]) => `<tr><th>${l}</th><td>${esc(f(A))}</td><td>${esc(f(B))}</td></tr>`).join('')}</tbody>
    </table>
  </div></div></div>`;
}

function blueprintHTML(A, B) {
  const s = Math.min(560 / Math.max(A.len, B.len), 175 / Math.max(A.hgt, B.hgt));
  const pa = profile(A, s, 300, 200), pb = profile(B, s, 300, 200);
  const fa = front(A, s, 120, 200), fb = front(B, s, 120, 200);
  const wheels = (p, k) => p.wheels.map(([x, y, r]) => `<circle class="wheel ${k}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"/>`).join('');
  const m = v => fmt(v / 1000, 2) + ' מ׳';
  return `<div class="panel blueprint">
    <div class="mc-h"><h4>השוואת מידות בקנה מידה אמיתי</h4></div>
    <div class="bp-grid">
      <figure>
        <svg class="bp-svg" viewBox="0 0 600 214" role="img" aria-label="מבט צד: ${SIDE.a} באורך ${m(A.len)}, ${SIDE.b} באורך ${m(B.len)}">
          <line class="ground" x1="10" y1="200" x2="590" y2="200"/>
          <path class="shape b draw" d="${pb.body}"/>${wheels(pb, 'b')}
          <path class="shape a draw" d="${pa.body}"/>${wheels(pa, 'a')}
        </svg>
        <figcaption>מבט צד — אורך, גובה ובסיס גלגלים</figcaption>
      </figure>
      <figure>
        <svg class="bp-svg" viewBox="0 0 240 214" role="img" aria-label="מבט חזית: רוחב ${m(A.wid)} מול ${m(B.wid)}">
          <line class="ground" x1="8" y1="200" x2="232" y2="200"/>
          <path class="shape b draw" d="${fb}"/>
          <path class="shape a draw" d="${fa}"/>
        </svg>
        <figcaption>מבט חזית — רוחב וגובה</figcaption>
      </figure>
    </div>
    <div class="bp-legend">
      <span class="side-a"><i></i>${SIDE.a}: ${m(A.len)} × ${m(A.wid)} × ${m(A.hgt)}</span>
      <span class="side-b"><i></i>${SIDE.b}: ${m(B.len)} × ${m(B.wid)} × ${m(B.hgt)}</span>
    </div>
  </div>`;
}

function radarHTML(A, B) {
  const cx = 180, cy = 160, R = 110, n = AXES.length;
  const pt = (i, r) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const poly = c => AXES.map((ax, i) => pt(i, R * Math.max(.04, axisVal(ax, c))).map(v => v.toFixed(1)).join(',')).join(' ');
  const rings = [.25, .5, .75, 1].map(f => `<polygon class="ring" points="${AXES.map((_, i) => pt(i, R * f).join(',')).join(' ')}"/>`).join('');
  const axes = AXES.map((ax, i) => {
    const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 24);
    return `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>
      <text class="lbl" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${ax.label}</text>`;
  }).join('');
  return `<svg class="radar" viewBox="0 0 360 310" role="img" aria-label="תרשים רדאר של ציוני הביצועים">
    ${rings}${axes}
    <polygon class="poly b" points="${poly(B)}"/>
    <polygon class="poly a" points="${poly(A)}"/>
  </svg>`;
}

function verdictHTML(A, B, sa, sb) {
  const diff = Math.abs(sa - sb);
  const tie = diff < 1;
  const W = sa >= sb ? 'a' : 'b', Lo = W === 'a' ? 'b' : 'a';
  const cars = { a: A, b: B };
  const reasons = AXES
    .map(ax => ({ ax, gain: ax.w * (axisVal(ax, cars[W]) - axisVal(ax, cars[Lo])) }))
    .filter(r => r.gain > 0.3).sort((x, y) => y.gain - x.gain).slice(0, 2).map(r => r.ax.reason);
  const pct = Math.round(diff / Math.min(sa, sb) * 100);

  const titles = [];
  if (comparable(METRICS.find(m => m.key === 'cons'), A, B) && A.cons !== B.cons) titles.push(['חסכוני יותר', A.cons < B.cons ? 'a' : 'b']);
  if (A.trunk !== B.trunk) titles.push(['תא מטען גדול יותר', A.trunk > B.trunk ? 'a' : 'b']);
  if (A.kg !== B.kg) titles.push(['קל יותר', A.kg < B.kg ? 'a' : 'b']);
  if (A.seats !== B.seats) titles.push(['יותר מושבים', A.seats > B.seats ? 'a' : 'b']);

  const flag = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18" stroke="currentColor" stroke-width="2"/><path d="M6 4h14v10H6z" fill="#fff"/><path d="M6 4h3.5v2.5H6zM13 4h3.5v2.5H13zM9.5 6.5H13V9H9.5zM16.5 6.5H20V9h-3.5zM6 9h3.5v2.5H6zM13 9h3.5v2.5H13zM9.5 11.5H13V14H9.5zM16.5 11.5H20V14h-3.5z" fill="#0b0c0f"/></svg>`;
  const head = tie
    ? `<h2><span class="who">תוצאה</span>תיקו צמוד!</h2>
       <p class="v-lead">שני הרכבים סיימו כמעט באותו ציון ביצועים — ההכרעה תלויה במה שחשוב לכם.</p>`
    : `<h2><span class="who">${SIDE[W]} מנצח</span>${esc(cars[W].name)}</h2>
       <p class="v-lead">מוביל ב-<strong>${fmt(diff, 0)} נקודות</strong> (${pct > 300 ? 'יותר מפי ' + Math.floor(sa >= sb ? sa / sb : sb / sa) : pct + '%'})${reasons.length ? ` בזכות ${reasons[0]}${reasons[1] ? ' ו' + reasons[1] : ''}` : ''}.</p>`;

  return `<section class="verdict" aria-label="מי מנצח">
    <div class="panel v-radar">
      <h3>פרופיל ביצועים</h3>
      ${radarHTML(A, B)}
      <div class="legend"><span class="side-a"><i></i>${esc(A.name)}</span><span class="side-b"><i></i>${esc(B.name)}</span></div>
    </div>
    <div class="panel v-main${tie ? '' : ' win'}">
      <p class="kicker">${flag} מי מנצח?</p>
      ${head}
      <div class="scores">
        ${['a', 'b'].map(k => {
          const sc = k === 'a' ? sa : sb;
          return `<div class="score-row side-${k}"><span class="nm">${SIDE[k]}</span>
            <div class="tr"><i data-w="${sc.toFixed(1)}"></i></div>
            <span class="pt" data-to="${sc.toFixed(0)}">0</span></div>`;
        }).join('')}
      </div>
      ${titles.length ? `<ul class="titles">${titles.map(([t, k]) => `<li class="side-${k}">${t}: <b>${SIDE[k]}</b></li>`).join('')}</ul>` : ''}
      <details class="method">
        <summary>איך מחושב הציון?</summary>
        <p>ציון ביצועים מ-0 עד 100, לפי סולם קבוע (לא יחסי ליריב): תאוצה 0–100 (30%), יחס כוח־משקל (25%), כוח סוס (20%), מהירות מרבית (15%) ומומנט (10%). יעילות ופרקטיות מוצגות כתארים נפרדים ולא משפיעות על ציון הביצועים.</p>
      </details>
    </div>
  </section>`;
}

function fullTableHTML(A, B) {
  const rows = [
    ['יצרן', c => `${c.mkHe} (${c.mk})`], ['דגם', c => c.md], ['גרסה', c => c.tr || 'בסיס'], ['שנה', c => c.y],
    ['מרכב', c => c.body], ['מנוע', c => c.eng], ['אנרגיה', c => FUEL_HE[c.fuel]],
    ...METRICS.map(m => [m.label, c => {
      const v = c[m.key];
      if (v == null) return m.key === 'cc' && c.fuel === 'ev' ? 'חשמלי' : '—';
      return `${fmt(v, m.dec || 0)} ${m.key === 'cons' ? consUnit(c) : m.unit}`.trim();
    }, m]),
    ['תיבת הילוכים', c => c.trans], ['הנעה', c => c.drive],
  ];
  return `<details class="full">
    <summary>טבלת מפרט מלאה</summary>
    <div class="scroll"><table>
      <thead><tr><th>מאפיין</th><th class="side-a" style="color:var(--a)">${esc(A.name)}</th><th class="side-b" style="color:var(--b)">${esc(B.name)}</th></tr></thead>
      <tbody>${rows.map(([l, f, m]) => {
        const L = m ? leader(m, A, B) : null;
        return `<tr><th>${l}</th><td class="side-a${L === 'a' ? ' win' : ''}">${esc(f(A))}</td><td class="side-b${L === 'b' ? ' win' : ''}">${esc(f(B))}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </details>`;
}

function compare() {
  const A = slots.a.resolveTyped(), B = slots.b.resolveTyped();
  if (!A || !B) return;
  const sa = perfScore(A), sb = perfScore(B);
  const W = Math.abs(sa - sb) < 1 ? null : (sa > sb ? 'a' : 'b');

  const groupsHTML = GROUPS.map(g => {
    let i = 0;
    let cards = METRICS
      .filter(m => m.g === g.id)
      .filter(m => m.key !== 'range' || A.fuel === 'ev' || B.fuel === 'ev')
      .map(m => metricCard(m, A, B, i++)).join('');
    if (g.id === 'engine') cards = engineCard(A, B, i++) + cards;
    if (g.id === 'dims') cards = blueprintHTML(A, B) + cards;
    return `<section class="group" data-reveal><div class="group-h"><h3>${g.title}</h3><span>${g.sub}</span></div><div class="mgrid">${cards}</div></section>`;
  }).join('');

  results.innerHTML = `
    <div class="res-bar">
      <h2>${esc(A.full)} <span aria-hidden="true">⟷</span> ${esc(B.full)}</h2>
      <button class="ghost" id="share" type="button">🔗 העתק קישור לקרב</button>
    </div>
    <div class="duel" data-reveal>
      ${heroHTML(A, 'a', sa, W === 'a')}
      <div class="vs-chip" aria-hidden="true">VS</div>
      ${heroHTML(B, 'b', sb, W === 'b')}
    </div>
    <div data-reveal data-verdict>${verdictHTML(A, B, sa, sb)}</div>
    ${groupsHTML}
    ${fullTableHTML(A, B)}`;
  results.hidden = false;

  history.replaceState(null, '', `#a=${A.id}&b=${B.id}`);
  $('#share').addEventListener('click', share);
  $$('.hero', results).forEach(tilt);
  observe(W);
  results.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
}
goBtn.addEventListener('click', compare);

/* Flip metric cards */
results.addEventListener('click', e => {
  const card = e.target.closest('button.mcard');
  if (!card) return;
  const on = card.classList.toggle('flipped');
  card.setAttribute('aria-pressed', on);
  $('.back', card).setAttribute('aria-hidden', !on);
  $('.front', card).setAttribute('aria-hidden', on);
});

/* =====================================================================
   MOTION
   ===================================================================== */
function countUp(root) {
  $$('[data-to]', root).forEach(el => {
    if (el.dataset.done) return;
    el.dataset.done = 1;
    const to = +el.dataset.to, dec = +(el.dataset.dec || 0);
    if (RM) { el.textContent = fmt(to, dec); return; }
    const t0 = performance.now() + 250, dur = 1100;
    const tick = now => {
      const t = clamp((now - t0) / dur);
      el.textContent = fmt(to * (1 - Math.pow(1 - t, 3)), dec);
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

let io;
function observe(winner) {
  if (io) io.disconnect();
  const reveal = el => {
    el.classList.add('in');
    countUp(el);
    $$('.tr i', el).forEach(i => i.style.width = i.dataset.w + '%');
    if (el.hasAttribute('data-verdict') && winner) setTimeout(() => confetti($('.v-main', el)), 500);
  };
  const els = $$('[data-reveal]', results);
  if (!('IntersectionObserver' in window)) return els.forEach(reveal);
  io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { reveal(en.target); io.unobserve(en.target); }
  }), { threshold: 0.15 });
  els.forEach(el => io.observe(el));
}

function tilt(card) {
  if (RM || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  card.addEventListener('animationend', () => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.style.transform = `rotateY(${(x - .5) * 10}deg) rotateX(${(.5 - y) * 10}deg)`;
      card.style.setProperty('--gx', x * 100 + '%');
      card.style.setProperty('--gy', y * 100 + '%');
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  }, { once: true });
}

const cvs = $('#confetti'), ctx = cvs.getContext('2d');
let confRun = 0;
function confetti(fromEl) {
  if (RM || !fromEl) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = fromEl.getBoundingClientRect();
  const colors = ['#ffffff', '#0b0c0f', '#ffd447', '#c8ff3d', '#ff6a2b', '#ffffff'];
  const parts = Array.from({ length: innerWidth < 600 ? 110 : 180 }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2;
    const sp = 5 + Math.random() * 9;
    return { x: r.left + Math.random() * r.width, y: r.top + 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      s: 5 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[(Math.random() * colors.length) | 0] };
  });
  const run = ++confRun, t0 = performance.now();
  const frame = now => {
    if (run !== confRun) return;
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalAlpha = clamp(1 - (t - 2400) / 800);
    for (const p of parts) {
      p.vy += .24; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.c === '#0b0c0f') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(-p.s / 2, -p.s / 2, p.s, p.s * Math.abs(Math.cos(p.rot))); }
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * Math.abs(Math.cos(p.rot)));
      ctx.restore();
    }
    if (t < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(frame);
}

/* =====================================================================
   SHARE + DEEP LINK
   ===================================================================== */
const toast = $('#toast');
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove('show'), 2200);
}
async function share() {
  try { await navigator.clipboard.writeText(location.href); showToast('הקישור הועתק ✓'); }
  catch { showToast('העתיקו את הכתובת משורת הדפדפן'); }
}

const params = new URLSearchParams(location.hash.slice(1));
const ha = byId(params.get('a')), hb = byId(params.get('b'));
if (ha && hb) { slots.a.select(ha); slots.b.select(hb); compare(); }
})();
</script>
